<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro de Filmes</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <main>
    <h1>Registro de Filmes</h1>

    <section id="tela-login">
      <h2>Entrar</h2>
      <form id="form-login">
        <label>E-mail <input id="email" type="email" required autocomplete="username"></label>
        <label for="senha">Senha</label>
        <div class="campo-senha">
            <input id="senha" type="password" required autocomplete="current-password">
            <button id="ver-senha" type="button" class="secundario" aria-pressed="false">Mostrar</button>
        </div>
        <button type="submit">Entrar</button>
      </form>
    </section>

    <section id="tela-app" hidden>
      <button id="sair" type="button" class="secundario">Sair</button>

      <h2>Registrar filme</h2>
      <form id="form-filme">
        <label>Título <input id="titulo" required></label>
        <label>Nota de 0 a 10 <input id="nota" type="number" min="0" max="10" step="0.05" required></label>
        <label>Data em que assistiu <input id="data" type="date" required></label>
        <label>Gênero <input id="genero" list="generos"></label>
        <datalist id="generos"></datalist>
        <label>Duração (min) <input id="minutos" type="number" min="1" step="1"></label>
        <label>Ano de lançamento <input id="lancamento" type="number" min="1880" max="2100" step="1"></label>
        <label>Plataforma <input id="plataforma" list="plataformas"></label>
        <datalist id="plataformas"></datalist>
        <button type="submit">Salvar</button>
      </form>

      <h2>Últimos filmes</h2>
      <ol id="ultimos"></ol>

      <h2>Registrar série</h2>
      <form id="form-serie">
        <label>Série e temporada <input id="serie-titulo" required></label>
        <label>Nota (em branco se ainda está vendo) <input id="serie-nota" type="number" min="0" max="10" step="0.05"></label>
        <label>Início <input id="serie-inicio" type="date" required></label>
        <label>Fim <input id="serie-fim" type="date"></label>
        <label>Gênero <input id="serie-genero" list="generos"></label>
        <label>Plataforma <input id="serie-plataforma" list="plataformas"></label>
        <button type="submit">Salvar série</button>
      </form>
    </section>

    <p id="aviso" role="status"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
  <script src="app.js"></script>
</body>
</html>
